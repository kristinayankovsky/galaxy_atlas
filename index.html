<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="kristina yankovsky">
    <title>Galaxy Atlas</title>
    <link rel="icon" type="image/jpg" href="./assets/images/logo.jpg">
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
     <header class="site-header">
    <h1> Galaxy Atlas</h1>
    <p class="tagline">Explore the Solar System</p>
    </header>
    <main class="main-layout">

    <!-- Solar System Visualization -->
    <section class="solar-system" aria-label="Solar system visualization">
      <canvas id="starfield"></canvas>

      <div class="sun">

      </div>
     

  

<div class="orbit mercury-orbit">
  <div class="planet-wrapper">
  <button class="planet mercury" data-planet="mercury"></button>
  </div>
</div>

<div class="orbit venus-orbit">
  <div class="planet-wrapper">
  <button class="planet venus" data-planet="venus"></button>
  </div>
</div>

<div class="orbit earth-orbit">
  <div class="planet-wrapper">
  <button class="planet earth" data-planet="earth"></button>
  </div>
</div>

<div class="orbit mars-orbit">
  <div class="planet-wrapper">
  <button class="planet mars" data-planet="mars"></button>
  </div>
</div>

<div class="orbit jupiter-orbit">
  <div class="planet-wrapper">
  <button class="planet jupiter" data-planet="jupiter"></button>
  </div>
</div>

<div class="orbit saturn-orbit">
  <div class="planet-wrapper">
  <button class="planet saturn" data-planet="saturn"></button>
  </div>
</div>

<div class="orbit uranus-orbit">
  <div class="planet-wrapper">
  <button class="planet uranus" data-planet="uranus"></button>
  </div>
</div>

<div class="orbit neptune-orbit">
  <div class="planet-wrapper">
  <button class="planet neptune" data-planet="neptune"></button>
  </div>
</div>
      
     
    </section>
<!-- Planet Info Panel -->
    <aside class="planet-info" aria-live="polite">
      <h2 id="planet-name">Select a planet</h2>

      <img
        id="planet-image"
        src="assets/images/placeholder.jpg"
        alt="Planet preview"
        
      />
      <ul class="planet-stats"></ul>

       <p id="planet-fact" class="planet-fact">
        Click on a planet to learn more about it.
      </p>
    </aside>

  </main>
 
  <footer class="site-footer">
    <p>Built by Kristina • Galaxy Atlas Project</p>
  </footer>

  
  
  <script type="module" src="./js/app.js"></script>


</body>
</html>
